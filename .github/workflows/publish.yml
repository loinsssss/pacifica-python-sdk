name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from pyproject.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if project["version"] != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("Requested version does not match pyproject.toml")
          if project["license"] != "MIT":
              raise SystemExit("Expected an MIT-licensed release")
          PY
      - run: python -m pip install -e ".[dev]" twine
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -m "not integration" -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check independent wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/pacifica-consumer"
          "$RUNNER_TEMP/pacifica-consumer/bin/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/pacifica-smoke"
          cp tests/consumer_smoke.py "$RUNNER_TEMP/pacifica-smoke/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pacifica-consumer/bin/python" -I \
            "$RUNNER_TEMP/pacifica-smoke/consumer_smoke.py"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pacifica-python-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
