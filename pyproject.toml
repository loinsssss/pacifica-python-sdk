[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pacifica-python-sdk"
version = "0.1.0a1"
description = "Independent asynchronous Pacifica REST and WebSocket client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "loinsssss" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "websockets>=15,<18",
    "solders>=0.21,<1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.urls]
Repository = "https://github.com/loinsssss/pacifica-python-sdk"
Issues = "https://github.com/loinsssss/pacifica-python-sdk/issues"
Documentation = "https://github.com/loinsssss/pacifica-python-sdk/blob/main/docs/developer-guide.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pacifica"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/scripts", "/docs",
    "/README.md", "/LICENSE", "/pyproject.toml", "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: explicitly enabled live network checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pacifica"]
